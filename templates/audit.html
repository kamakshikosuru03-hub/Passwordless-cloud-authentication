<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioCrypt | Cryptographic Audit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0b1120;
            color: #e2e8f0;
            font-family: 'Monaco', 'Consolas', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .audit-container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 2rem;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .terminal-header {
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .key-display {
            background: #0f172a;
            border: 1px solid #1e293b;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #38bdf8;
            word-break: break-all;
            min-height: 60px;
            margin-top: 5px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .scanning {
            color: #fbbf24;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.4; } }

        .progress {
            height: 4px;
            background: #334155;
            margin: 2rem 0;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #3b82f6, #2dd4bf);
            transition: width 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-enter {
            background: #3b82f6;
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-enter:hover {
            background: #2563eb;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .match-success { color: #10b981; }
    </style>
</head>
<body>

<div class="audit-container">
    <div class="terminal-header">
        <div>
            <i class="fas fa-shield-halved text-primary me-2"></i>
            <strong>IDENTITY RECONSTRUCTION AUDIT</strong>
        </div>
        <span id="header-status" class="status-badge bg-primary">Processing</span>
    </div>

    <p class="text-secondary small">Session User: <span class="text-light" id="display-user">{{ user }}</span></p>

    <div class="row g-3">
        <div class="col-md-6">
            <label class="small text-secondary mb-1">ECC PRIVATE KEY (STORED)</label>
            <div id="storedKey" class="key-display">Scanning database...</div>
        </div>
        <div class="col-md-6">
            <label class="small text-secondary mb-1">RECONSTRUCTED PRIVATE KEY (LIVE)</label>
            <div id="liveKey" class="key-display">Awaiting fuzzy match...</div>
        </div>
    </div>

    <div class="progress">
        <div id="pBar" class="progress-bar" style="width: 0%"></div>
    </div>

    <div id="status-text" class="text-center scanning">
        <i class="fas fa-sync fa-spin me-2"></i> EXECUTING FUZZY VAULT RECONSTRUCTION...
    </div>

    <div class="text-center mt-4">
        <button id="proceedBtn" class="btn btn-enter d-none" onclick="proceedToPhase3()">
            PROCEED TO ECDSA SIGNING <i class="fas fa-key ms-2"></i>
        </button>
    </div>
</div>

<script>
    // FIXED: Helper function to bridge Audit and Phase 3
    function proceedToPhase3() {
        const user = "{{ user }}";
        localStorage.setItem('vault_user', user); // Store for Phase 3
        window.location.href = '/login_page?phase=3';
    }

    async function runAudit() {
        const pBar = document.getElementById('pBar');
        const statusText = document.getElementById('status-text');
        const proceedBtn = document.getElementById('proceedBtn');
        const headerStatus = document.getElementById('header-status');

        // Start animation
        setTimeout(() => { pBar.style.width = "100%"; }, 100);

        try {
            // Trigger the integrity check from app.py
            const response = await fetch('/verify_key_integrity', { method: 'POST' });
            const data = await response.json();

            // Artificial delay for visual effect
            setTimeout(() => {
                if (data.status === "Verified") {
                    document.getElementById('storedKey').innerText = data.stored_snippet;
                    document.getElementById('liveKey').innerText = data.reconstructed_snippet;
                    
                    statusText.innerHTML = '<span class="match-success"><i class="fas fa-check-circle"></i> INTEGRITY VERIFIED: KEYS MATCH 100%</span>';
                    statusText.classList.remove('scanning');
                    
                    headerStatus.innerText = "Verified";
                    headerStatus.className = "status-badge bg-success";
                    
                    proceedBtn.classList.remove('d-none');
                } else {
                    statusText.innerHTML = '<span class="text-danger"><i class="fas fa-times-circle"></i> CRITICAL ERROR: KEY MISMATCH</span>';
                    headerStatus.innerText = "Failed";
                    headerStatus.className = "status-badge bg-danger";
                }
            }, 2500);

        } catch (error) {
            statusText.innerText = "System Error: Failed to contact vault.";
        }
    }

    window.onload = runAudit;
</script>

</body>
</html>
